<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 950" width="2240" height="950" role="img" aria-label="POWER PRESS placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#000A22"/>
    </linearGradient>
    <pattern id="hatch" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#ffffff" stroke-opacity="0.045" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="2240" height="950" fill="url(#bg)"/>
  <rect width="2240" height="950" fill="url(#hatch)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="7" stroke-linejoin="round">
    <!-- shop floor -->
    <path d="M0 830h2240"/>
    <!-- press frame: crown, uprights, bed -->
    <rect x="700" y="120" width="840" height="90"/>
    <rect x="700" y="210" width="110" height="620"/>
    <rect x="1430" y="210" width="110" height="620"/>
    <rect x="620" y="700" width="1000" height="130"/>
    <!-- ram, punch and bolster -->
    <rect x="860" y="380" width="520" height="190"/>
    <rect x="1060" y="570" width="120" height="70"/>
    <rect x="810" y="640" width="620" height="60"/>
    <!-- drive wheel on the crown -->
    <circle cx="1120" cy="165" r="34"/>
    <path d="M1120 165V133"/>
    <!-- bolts down the uprights -->
    <circle cx="755" cy="300" r="17"/>
    <circle cx="755" cy="440" r="17"/>
    <circle cx="755" cy="580" r="17"/>
    <circle cx="1485" cy="300" r="17"/>
    <circle cx="1485" cy="440" r="17"/>
    <circle cx="1485" cy="580" r="17"/>
    <!-- control box -->
    <rect x="1600" y="560" width="200" height="270"/>
    <rect x="1636" y="600" width="128" height="70"/>
    <circle cx="1660" cy="730" r="20"/>
    <circle cx="1720" cy="730" r="20"/>
    <circle cx="1780" cy="730" r="20"/>
    <path d="M1800 560v-90h140v300"/>
  </g>
</svg>